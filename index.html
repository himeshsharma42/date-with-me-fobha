<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="question-screen">
            <div class="heart">❤️</div>

            <h1>Hey fobha...</h1>

            <p class="subtitle">
                I have a very important question for you.
            </p>

            <h2>Will you go on a date with me? 🌹</h2>

            <div class="buttons">
                <button id="yesBtn">YES ❤️</button>
                <button id="noBtn">NO 🙈</button>
            </div>

            <p id="message"></p>
        </div>

        <div id="success-screen" class="hidden">

            <div class="heart">💖</div>

            <h1>YAYYYYY! 🥰</h1>

            <p>
                I knew you'd say yes ❤️
            </p>

            <div class="date-card">

                <h2>Our Date 🌹</h2>

                <p><strong>📅 Date:</strong> 21-08-26 😉</p>

                <p><strong>📍 Location:</strong> Somewhere special</p>

                <p><strong>⏰ Time:</strong> 7pm</p>

                <p class="special">
                    something pretty and slutty
                </p>

            </div>

            <button onclick="celebrate()">One more thing... 💌</button>

        </div>

    </div>

    <div id="hearts"></div>

    <script src="script.js"></script>

</body>
</html>
